<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Счётчик калорий</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f7ef8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Калории" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Счётчик калорий</h1>
      <div class="date-display" id="dateDisplay"></div>
    </header>

    <section class="goal-section card">
      <div class="goal-info">
        <span class="label">Цель на день</span>
        <div class="goal-controls">
          <input type="number" id="goalInput" class="goal-input" min="100" max="10000" step="50" />
          <span class="unit">ккал</span>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-labels">
          <span id="consumedLabel">0 ккал</span>
          <span id="remainingLabel"></span>
        </div>
      </div>
      <div class="macros-summary" id="macrosSummary">
        <div class="macro">
          <span class="macro-val" id="totalProtein">0</span>
          <span class="macro-label">Белки, г</span>
        </div>
        <div class="macro">
          <span class="macro-val" id="totalFat">0</span>
          <span class="macro-label">Жиры, г</span>
        </div>
        <div class="macro">
          <span class="macro-val" id="totalCarbs">0</span>
          <span class="macro-label">Углеводы, г</span>
        </div>
      </div>
    </section>

    <section class="add-section card">
      <h2>Добавить продукт</h2>
      <form id="foodForm" autocomplete="off">
        <div class="form-row">
          <div class="field field--wide">
            <label for="foodSearch">Название</label>
            <div class="search-wrap">
              <input type="text" id="foodSearch" placeholder="Введите название..." />
              <ul class="suggestions" id="suggestions"></ul>
            </div>
          </div>
          <div class="field">
            <label for="weightInput">Вес, г</label>
            <input type="number" id="weightInput" min="1" max="5000" value="100" />
          </div>
        </div>
        <div class="form-row macros-row" id="macrosRow">
          <div class="field">
            <label for="caloriesInput">Калории</label>
            <input type="number" id="caloriesInput" placeholder="на 100 г" min="0" step="0.1" />
          </div>
          <div class="field">
            <label for="proteinInput">Белки, г</label>
            <input type="number" id="proteinInput" placeholder="на 100 г" min="0" step="0.1" />
          </div>
          <div class="field">
            <label for="fatInput">Жиры, г</label>
            <input type="number" id="fatInput" placeholder="на 100 г" min="0" step="0.1" />
          </div>
          <div class="field">
            <label for="carbsInput">Углеводы, г</label>
            <input type="number" id="carbsInput" placeholder="на 100 г" min="0" step="0.1" />
          </div>
        </div>
        <div class="meal-select-row">
          <label>Приём пищи:</label>
          <div class="meal-buttons" id="mealButtons">
            <button type="button" class="meal-btn active" data-meal="breakfast">Завтрак</button>
            <button type="button" class="meal-btn" data-meal="lunch">Обед</button>
            <button type="button" class="meal-btn" data-meal="dinner">Ужин</button>
            <button type="button" class="meal-btn" data-meal="snack">Перекус</button>
          </div>
        </div>
        <button type="submit" class="btn-add" id="btnAdd">Добавить</button>
      </form>
    </section>

    <section class="log-section">
      <div class="log-header">
        <h2>Дневник питания</h2>
        <button class="btn-clear" id="btnClear">Очистить день</button>
      </div>
      <div id="mealGroups"></div>
      <p class="empty-state" id="emptyState">Ничего не добавлено. Начните вести дневник!</p>
    </section>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
